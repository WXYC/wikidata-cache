services:
  db:
    # Custom image overlaying wxyc_unaccent.rules onto railwayapp-templates/postgres-ssl
    # so the F0000 precheck in migrations/0003_wxyc_identity_match_functions.sql finds
    # the rules file at $SHAREDIR/tsearch_data/. Built + published by WXYC/wxyc-etl#127.
    # Operator runbook: https://github.com/WXYC/wxyc-etl/blob/main/docs/wxyc-postgres-image.md
    image: ghcr.io/wxyc/wxyc-postgres:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikidata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikidata}
      POSTGRES_DB: ${POSTGRES_DB:-wikidata_test}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikidata}"]
      interval: 2s
      timeout: 5s
      retries: 10
